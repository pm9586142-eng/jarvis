[build]
  command = "npm run build"
  publish = "dist"

# Ensure /api/* requests are never rewritten to index.html on static Netlify hosts.
# Set VITE_API_BASE_URL to your deployed Express backend URL (e.g. Cloud Run).
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
