name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.env.example'
      - 'debug.keystore.base64'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36.1 (cmdline-tools, platform-tools, build-tools)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root not found at $SDK_ROOT"
            exit 1
          fi

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android cmdline-tools sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "cmdline-tools;latest"
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          set -o pipefail

          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "ERROR: Required Android SDK 36.1 platform or build-tools 36.0.0 missing."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK ready at $SDK_ROOT (cmdline-tools, platform-tools, android-36.1, build-tools 36.0.0)."

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
              echo "Generated fresh Android debug.keystore."
            fi
          fi

      - name: Configure optional BuildConfig environment from GitHub Secrets
        env:
          CFG_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CFG_GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CFG_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CFG_APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          CFG_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CFG_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          rm -f .env
          configured_count=0
          write_secret() {
            local key_name="$1"
            local key_value="$2"
            if [ -n "$key_value" ]; then
              printf '%s=%s\n' "$key_name" "$key_value" >> .env
              configured_count=$((configured_count + 1))
            fi
          }
          write_secret "GEMINI_API_KEY" "$CFG_GEMINI_API_KEY"
          write_secret "GEMINI_MODEL" "$CFG_GEMINI_MODEL"
          write_secret "BACKEND_URL" "$CFG_BACKEND_URL"
          write_secret "APP_ACCESS_TOKEN" "$CFG_APP_ACCESS_TOKEN"
          write_secret "GROQ_API_KEY" "$CFG_GROQ_API_KEY"
          write_secret "OPENROUTER_API_KEY" "$CFG_OPENROUTER_API_KEY"
          if [ "$configured_count" -gt 0 ]; then
            echo "Injected $configured_count GitHub Secret override(s) into BuildConfig (values redacted)."
          else
            echo "No optional GitHub Secrets configured; using .env.example defaults."
          fi

      - name: Verify Gradle Wrapper
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Clean up temporary secret env file
        if: always()
        run: rm -f .env

      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload JARVIS Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
